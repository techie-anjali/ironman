<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repulsor Hand</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { display: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<script>
const video = document.getElementById('video');
const cv = document.getElementById('canvas');
const ctx = cv.getContext('2d');

const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
              [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const CYAN = '#7df3ff', RED = '#ff3b30', GOLD = '#ffd24a';

let W = 0, H = 0, hands = [], parts = [], waves = [], flash = 0;
let charge = {}, camOn = true, status = 'Starting...', last = 0;

function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  if (k === 'v') camOn = !camOn;
});

const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/* map a landmark to screen coords (mirrored, same crop as the video) */
function map(l) {
  const x = 1 - l.x, y = l.y;
  if (!video.videoWidth) return { x: x * W, y: y * H };
  const k = Math.max(W / video.videoWidth, H / video.videoHeight);
  const w = video.videoWidth * k, h = video.videoHeight * k;
  return { x: (W - w) / 2 + x * w, y: (H - h) / 2 + y * h };
}

function onResults(r) {
  const list = r.multiHandLandmarks || [];
  hands = list.map((lm, i) => {
    const pts = lm.map(map);
    const ext = [[8, 6], [12, 10], [16, 14], [20, 18]]
      .filter(([t, p]) => d(pts[t], pts[0]) > d(pts[p], pts[0]) * 1.05).length;
    const ids = [0, 5, 9, 13, 17];
    const palm = { x: ids.reduce((s, j) => s + pts[j].x, 0) / 5, y: ids.reduce((s, j) => s + pts[j].y, 0) / 5 };
    const lab = r.multiHandedness && r.multiHandedness[i] ? r.multiHandedness[i].label : i;
    return { pts, ext, palm, size: d(pts[0], pts[9]), id: lab };
  });
  status = hands.length ? '' : 'Show your hand to the camera. Open palm = charge, fist = fire.';
}

/* ---------- effects ---------- */
function blast(h, c) {
  waves.push({ x: h.palm.x, y: h.palm.y, r: h.size * 0.3, life: 1, max: H * (0.35 + 0.5 * c) });
  const n = Math.floor(60 + 140 * c);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 150 + Math.random() * 800 * c;
    parts.push({ x: h.palm.x, y: h.palm.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                 life: 0.6 + Math.random() * 0.8, hue: Math.random() < 0.25 ? 45 : 190 });
  }
  flash = 0.25 + 0.4 * c;
}

function drawHand(h, c, t) {
  const p = h.pts, lw = Math.max(3, h.size * 0.06);
  ctx.save();
  /* armor plate on the palm */
  ctx.beginPath();
  [0, 5, 9, 13, 17].forEach((j, i) => i ? ctx.lineTo(p[j].x, p[j].y) : ctx.moveTo(p[j].x, p[j].y));
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,59,48,0.28)'; ctx.fill();
  /* red bones with glow */
  ctx.shadowColor = RED; ctx.shadowBlur = 14; ctx.strokeStyle = RED;
  ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); CONN.forEach(([a, b]) => { ctx.moveTo(p[a].x, p[a].y); ctx.lineTo(p[b].x, p[b].y); }); ctx.stroke();
  /* gold joints */
  ctx.shadowColor = GOLD; ctx.fillStyle = GOLD;
  p.forEach((q, i) => { ctx.beginPath(); ctx.arc(q.x, q.y, lw * ([4, 8, 12, 16, 20].includes(i) ? 1.1 : 0.7), 0, 7); ctx.fill(); });
  ctx.restore();

  if (charge[h.id] > 0.02) repulsor(h, c, t);
}

function repulsor(h, c, t) {
  const { x, y } = h.palm, R = h.size * (0.35 + 0.9 * c);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, R);
  g.addColorStop(0, `rgba(255,255,255,${0.15 + 0.85 * c})`);
  g.addColorStop(0.3, 'rgba(125,243,255,0.8)');
  g.addColorStop(1, 'rgba(0,150,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();

  ctx.strokeStyle = CYAN; ctx.lineWidth = 2 + c * 3; ctx.shadowColor = CYAN; ctx.shadowBlur = 12;
  for (let i = 0; i < 3; i++) {
    ctx.setLineDash([R * 0.25, R * 0.15]);
    ctx.lineDashOffset = (i % 2 ? -1 : 1) * t / (14 + i * 8);
    ctx.beginPath(); ctx.arc(x, y, R * (0.5 + 0.28 * i), 0, 7); ctx.stroke();
  }
  ctx.restore();

  ctx.fillStyle = CYAN; ctx.font = '600 15px monospace'; ctx.textAlign = 'center';
  ctx.fillText(c >= 0.45 ? `CHARGED ${Math.round(c * 100)}% - MAKE A FIST` : `CHARGING ${Math.round(c * 100)}%`, x, y + R + 22);
}

function arcBetween(a, b, t) {
  const n = 16, dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const [col, w, j] of [['rgba(0,170,255,0.5)', 7, 22], ['#bff9ff', 2, 14]]) {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.shadowColor = CYAN; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.moveTo(a.x, a.y);
    for (let i = 1; i < n; i++) {
      const f = i / n, o = (Math.random() - 0.5) * j * Math.sin(Math.PI * f);
      ctx.lineTo(a.x + dx * f + nx * o, a.y + dy * f + ny * o);
    }
    ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.restore();
}

function hud(t) {
  ctx.strokeStyle = 'rgba(125,243,255,0.6)'; ctx.lineWidth = 3;
  const m = 20, L = 44;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke();
  });
  ctx.fillStyle = 'rgba(125,243,255,0.85)'; ctx.font = '600 14px monospace'; ctx.textAlign = 'left';
  ctx.fillText('REPULSOR SYSTEM ONLINE', m + 12, m + 28);
  ctx.textAlign = 'right';
  ctx.fillText('HANDS: ' + hands.length + '   [V] camera   [F] fullscreen', W - m - 12, m + 28);
  if (status) {
    ctx.textAlign = 'center'; ctx.font = '600 18px monospace'; ctx.fillText(status, W / 2, H - 40);
  }
}

/* ---------- main loop ---------- */
function frame(t) {
  const dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (camOn && video.videoWidth) {
    const k = Math.max(W / video.videoWidth, H / video.videoHeight);
    const w = video.videoWidth * k, h = video.videoHeight * k;
    ctx.save(); ctx.globalAlpha = 0.8; ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, (W - w) / 2, (H - h) / 2, w, h); ctx.restore();
    ctx.fillStyle = 'rgba(0,15,30,0.35)'; ctx.fillRect(0, 0, W, H);
  }

  for (const k in charge) if (!hands.some((h) => h.id == k)) delete charge[k];

  hands.forEach((h) => {
    const c = charge[h.id] || 0;
    if (h.ext >= 4) charge[h.id] = Math.min(1, c + dt * 0.7);
    else if (h.ext <= 1) { if (c > 0.45) blast(h, c); charge[h.id] = 0; }
    else charge[h.id] = Math.max(0, c - dt * 1.5);
    drawHand(h, charge[h.id], t);
  });

  if (hands.length === 2 && hands.every((h) => h.ext >= 4)) arcBetween(hands[0].palm, hands[1].palm, t);

  /* shockwaves */
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  waves = waves.filter((w) => w.life > 0);
  waves.forEach((w) => {
    w.r += (w.max - w.r) * dt * 5 + 200 * dt; w.life -= dt * 1.3;
    ctx.strokeStyle = `rgba(150,240,255,${Math.max(0, w.life)})`; ctx.lineWidth = 14 * w.life + 1;
    ctx.shadowColor = CYAN; ctx.shadowBlur = 25;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, 7); ctx.stroke();
  });
  /* particles */
  parts = parts.filter((p) => p.life > 0);
  parts.forEach((p) => {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt;
    ctx.fillStyle = `hsla(${p.hue},100%,70%,${Math.min(1, p.life * 1.5)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 1 + 3 * p.life, 0, 7); ctx.fill();
  });
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = `rgba(200,250,255,${flash})`; ctx.fillRect(0, 0, W, H); flash -= dt * 1.2; }

  hud(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- start MediaPipe ---------- */
if (typeof Hands === 'undefined' || typeof Camera === 'undefined') {
  status = 'MediaPipe failed to load. Check internet / turn off ad blocker or VPN.';
} else {
  const hs = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
  hs.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
  hs.onResults(onResults);
  status = 'Loading hand model (10-30 seconds)...';
  hs.initialize()
    .then(() => {
      status = 'Starting camera...';
      const cam = new Camera(video, { onFrame: async () => { await hs.send({ image: video }); }, width: 1280, height: 720 });
      return cam.start();
    })
    .then(() => { status = 'Show your hand to the camera. Open palm = charge, fist = fire.'; })
    .catch((e) => { status = 'Failed: ' + (e && e.message ? e.message : e); });
}
</script>
</body>
</html>
